[theme]
base = "light"
primaryColor = "#0d8a7b"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#1b2b3b"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 2
maxMessageSize = 8

[browser]
gatherUsageStats = false
