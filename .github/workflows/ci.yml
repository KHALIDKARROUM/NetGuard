name: NetGuard checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  backend-tests:
    name: Backend and model tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      LOKY_MAX_CPU_COUNT: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the shared prediction runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run backend, security, and model tests
        env:
          NETGUARD_LOG_DIR: ${{ runner.temp }}/netguard-logs
        run: python -m unittest discover -s tests -v

  frontend-tests:
    name: Dashboard tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the dashboard runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            frontend/requirements.txt
            frontend/requirements-dev.txt
      - name: Install dashboard and test dependencies
        run: python -m pip install -r frontend/requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run dashboard flows and file-security tests
        run: python -m pytest frontend/tests -q

  docker-builds:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        if: matrix.service == 'backend'
        run: docker compose config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the service image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=netguard-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=netguard-${{ matrix.service }}
