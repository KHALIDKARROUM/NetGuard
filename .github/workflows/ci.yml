name: NetGuard checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  backend-tests:
    name: Backend and model tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      LOKY_MAX_CPU_COUNT: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the shared prediction runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run backend, security, and model tests
        env:
          NETGUARD_LOG_DIR: ${{ runner.temp }}/netguard-logs
        run: python -m unittest discover -s tests -v

  frontend-tests:
    name: Dashboard tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the dashboard runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            frontend/requirements.txt
            frontend/requirements-dev.txt
      - name: Install dashboard and test dependencies
        run: python -m pip install -r frontend/requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run dashboard flows and file-security tests
        run: python -m pytest frontend/tests -q

  docker-builds:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
          - service: auth
            context: ./deploy/auth
            dockerfile: deploy/auth/Dockerfile
          - service: gateway
            context: ./deploy/gateway
            dockerfile: deploy/gateway/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        if: matrix.service == 'backend'
        run: docker compose config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the service image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=netguard-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=netguard-${{ matrix.service }}

  docker-e2e:
    name: Docker end-to-end (${{ matrix.mode }})
    needs: docker-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [local, shared]
    env:
      NETGUARD_DEPLOYMENT_MODE: ${{ matrix.mode }}
      NETGUARD_BACKEND_PORT: "5101"
      NETGUARD_FRONTEND_PORT: "8602"
      COMPOSE_PROJECT_NAME: netguard-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}
      COMPOSE_FILE: docker-compose.yaml:docker-compose.e2e.yaml
      COMPOSE_PATH_SEPARATOR: ":"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up browser-test Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - name: Install browser-test dependencies
        run: |
          python -m pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Generate an ephemeral shared-mode key
        run: |
          python - <<'PY'
          import os, secrets
          key = secrets.token_urlsafe(32) if os.environ["NETGUARD_DEPLOYMENT_MODE"] == "shared" else ""
          if key:
              print("::add-mask::" + key)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("NETGUARD_API_KEY=" + key + "\n")
          PY
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Load backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          tags: netguard-e2e-backend:test
          load: true
          push: false
          cache-from: type=gha,scope=netguard-backend
      - name: Load frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: frontend/Dockerfile
          tags: netguard-e2e-frontend:test
          load: true
          push: false
          cache-from: type=gha,scope=netguard-frontend
      - name: Start isolated services and wait for health checks
        run: docker compose up --no-build --wait --wait-timeout 180
      - name: Test startup, uploads, predictions, and access
        run: python -m pytest tests/e2e -v --tracing retain-on-failure --screenshot only-on-failure --output artifacts/docker_e2e/browser --junitxml artifacts/docker_e2e/results.xml
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p artifacts/docker_e2e
          docker compose ps --all > artifacts/docker_e2e/services.txt
          docker compose logs --no-color --tail 200 > artifacts/docker_e2e/containers.log
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-e2e-${{ matrix.mode }}
          path: artifacts/docker_e2e/
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove the isolated test services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  sharing-e2e:
    name: Dashboard sign-in and HTTPS
    needs: docker-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NETGUARD_DEPLOYMENT_MODE: shared
      NETGUARD_TEST_CA: ${{ github.workspace }}/artifacts/sharing_e2e/root.crt
      COMPOSE_PROJECT_NAME: netguard-e2e-${{ github.run_id }}-${{ github.run_attempt }}-sharing
      COMPOSE_FILE: docker-compose.yaml:docker-compose.public.yaml:docker-compose.e2e.yaml:docker-compose.sharing-e2e.yaml
      COMPOSE_PATH_SEPARATOR: ":"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up sharing-test Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            tests/e2e/requirements.txt
            deploy/requirements.txt
      - name: Install browser and account-test dependencies
        run: |
          python -m pip install -r tests/e2e/requirements.txt -r deploy/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test account initialization and management
        run: python -m pytest deploy/tests -q
      - name: Prepare isolated accounts and local DNS
        run: |
          python tests/sharing/prepare.py
          sudo chgrp 10001 deploy/private/users.json deploy/private/session.key deploy/private/storage.key
          chmod 640 deploy/private/users.json deploy/private/session.key deploy/private/storage.key
          echo '127.0.0.1 netguard.example.test' | sudo tee -a /etc/hosts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Load backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          tags: netguard-e2e-backend:test
          load: true
          push: false
          cache-from: type=gha,scope=netguard-backend
      - name: Load frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: frontend/Dockerfile
          tags: netguard-e2e-frontend:test
          load: true
          push: false
          cache-from: type=gha,scope=netguard-frontend
      - name: Load authentication image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy/auth
          file: deploy/auth/Dockerfile
          tags: netguard-e2e-auth:test
          load: true
          push: false
          cache-from: type=gha,scope=netguard-auth
      - name: Load HTTPS gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy/gateway
          file: deploy/gateway/Dockerfile
          tags: netguard-e2e-gateway:test
          load: true
          push: false
          cache-from: type=gha,scope=netguard-gateway
      - name: Validate private service ports and gateway configurations
        run: |
          docker compose config --quiet
          docker compose run --rm --no-deps auth authelia config validate
          docker compose run --rm --no-deps gateway caddy validate --config /etc/caddy/Caddyfile
      - name: Start the isolated HTTPS dashboard
        run: |
          docker compose up --no-build --wait --wait-timeout 180
          mkdir -p artifacts/sharing_e2e
          docker compose exec -T gateway cat /data/caddy/pki/authorities/local/root.crt > "$NETGUARD_TEST_CA"
      - name: Test sign-in, HTTPS, protected uploads, logout, and lockout
        run: python -m pytest tests/sharing -v --tracing retain-on-failure --screenshot only-on-failure --output artifacts/sharing_e2e/browser --junitxml artifacts/sharing_e2e/results.xml
      - name: Collect sharing diagnostics
        if: always()
        run: |
          mkdir -p artifacts/sharing_e2e
          docker compose ps --all > artifacts/sharing_e2e/services.txt
          docker compose logs --no-color --tail 200 > artifacts/sharing_e2e/containers.log
          for container in $(docker compose ps --all -q); do
            docker inspect --format '{{.Name}} {{json .State.Health}}' "$container"
          done > artifacts/sharing_e2e/health-checks.txt
      - name: Save sharing failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-sharing
          path: artifacts/sharing_e2e/
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove the isolated sharing services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
