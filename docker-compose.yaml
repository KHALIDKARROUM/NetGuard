services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    volumes:
      - ./data:/app/../data:ro
      - ./models_saved:/app/../models_saved:ro
      - ./backend/logs:/app/logs
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "5000"
      API_DEBUG: "false"
      LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8502:8501"
    environment:
      BACKEND_URL: "http://backend:5000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
