services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ./data:/app/data:ro
      - ./models_saved:/app/models_saved:ro
      - netguard_logs:/app/backend/logs
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "5000"
      API_DEBUG: "false"
      LOG_LEVEL: "INFO"
      NETGUARD_API_KEY: "${NETGUARD_API_KEY:-}"
      NETGUARD_DEPLOYMENT_MODE: "${NETGUARD_DEPLOYMENT_MODE:-local}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8502:8501"
    environment:
      BACKEND_URL: "http://backend:5000"
      NETGUARD_API_KEY: "${NETGUARD_API_KEY:-}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  netguard_logs:
