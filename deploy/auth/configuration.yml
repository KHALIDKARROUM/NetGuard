theme: light
server:
  address: tcp://0.0.0.0:9091/auth
log:
  level: info
authentication_backend:
  password_reset:
    disable: true
  password_change:
    disable: true
  file:
    path: /run/secrets/dashboard_users
    watch: false
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
access_control:
  default_policy: deny
  rules:
    - domain: {{ mustEnv "NETGUARD_PUBLIC_HOST" | quote }}
      subject: ["group:netguard-users"]
      policy: one_factor
session:
  name: netguard_session
  same_site: lax
  inactivity: 15m
  expiration: 1h
  remember_me: -1
  cookies:
    - domain: {{ mustEnv "NETGUARD_PUBLIC_HOST" | quote }}
      authelia_url: {{ printf "https://%s/auth/" (mustEnv "NETGUARD_PUBLIC_HOST") | quote }}
storage:
  local:
    path: /var/lib/authelia/db.sqlite3
notifier:
  filesystem:
    filename: /var/lib/authelia/notifications.txt
regulation:
  modes: [user, ip]
  max_retries: 5
  find_time: 2m
  ban_time: 10m
ntp:
  disable_startup_check: true
